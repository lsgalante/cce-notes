[package]
name = "cce-notes"
version = "0.1.0"
edition = "2021"
description = "The vault's notes editor: Obsidian-compatible reading view, source editing and links over cce-vault"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "58af8bcb5416740337e9d06d3e5d3a8fef26b8e8", features = ["markdown", "doc_editor"] }
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "41ca52bd51ea3655a791c58005be9fce939e4333" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
chrono = "0.4"
log = "0.4"
serde_json = "1"
env_logger = "0.11"
# Embedded images: rasters decoded off the UI thread; SVG through the
# same resvg cce-ui draws icons with (its version, so one copy builds).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.41.0"
# Decoding pasted file:// URIs.
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
