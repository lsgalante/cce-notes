[package]
name = "cce-notes"
version = "0.1.0"
edition = "2021"
description = "The vault's notes editor: reading view, live preview and source editing, and links over cce-vault"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "95fffad88532afc3c2d449a286b94655993f5279", features = ["markdown", "doc_editor"] }
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "dc0aa0eb70691e26c1afcc70e87eb4b63e2fb7b6" }
# The agenda's JSON and its lines (the daemon's `agenda` answer); the
# library only, no I/O.
cce-sync = { git = "https://github.com/lsgalante/cce-sync.git", rev = "86214e2f689ade8d912d07008a6ecd8741be571b", default-features = false }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
chrono = "0.4"
log = "0.4"
serde_json = "1"
env_logger = "0.11"
# Embedded images: rasters decoded off the UI thread; SVG through the
# same resvg cce-ui draws icons with (its version, so one copy builds).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
resvg = "0.41.0"
# Decoding pasted file:// URIs.
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
