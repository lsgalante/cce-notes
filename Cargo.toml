[package]
name = "cce-notes"
version = "0.1.0"
edition = "2021"
description = "The vault's notes editor: Obsidian-compatible reading view, source editing and links over cce-vault"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "3825007457507df4f0ee164f1be8cec626ec41cc" }
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "11a26a5f8e1ff1ac55a951d88afc751ab68a5aba" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
