[package]
name = "cce-notes"
version = "0.1.0"
edition = "2021"
description = "The vault's notes editor: Obsidian-compatible reading view, source editing and links over cce-vault"

[dependencies]
cce-ui = { git = "https://github.com/lsgalante/cce-ui.git", rev = "5a528578745f12d38afc78bd697fda37d4d187c8", features = ["markdown", "doc_editor"] }
cce-vault = { git = "https://github.com/lsgalante/cce-vault.git", rev = "252827c1f6033514fbed46d1c7c1632241344fce" }
calloop = "0.13.0"
wayland-client = { version = "0.31", features = ["system"] }
chrono = "0.4"
log = "0.4"
serde_json = "1"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
